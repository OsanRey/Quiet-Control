name: Source checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile --registry https://registry.npmjs.org
      - run: pnpm build
      - run: node scripts/quiet-control/unified-nodes-test.mjs
      - run: node scripts/quiet-control/latency-display-test.mjs
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --lib
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
      # Binary publication deliberately absent: see THIRD-PARTY-NOTICES.md.
